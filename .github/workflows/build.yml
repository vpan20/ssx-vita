name: Build SSX.vpk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install port libraries
        run: |
          vdpm vitaGL kubridge taihen || true
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK && make -C vitaShaRK install
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon && make -C math-neon install
      - name: Build
        run: mkdir -p build && cd build && cmake .. && make
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SSX-vpk
          path: build/SSX.vpk
