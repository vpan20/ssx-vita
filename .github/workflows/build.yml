name: Build SSX.vpk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
      - name: Install soft-float VitaSDK
        run: |
          sudo apt-get update && sudo apt-get install -y cmake git make curl
          git clone --depth 1 https://github.com/vitasdk-softfp/vdpm
          cd vdpm && sudo -E ./bootstrap-vitasdk.sh && sudo -E ./install-all.sh
          sudo chown -R $USER $VITASDK
      - name: Install port libraries
        run: |
          export PATH=$VITASDK/bin:$PATH
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK && make -C vitaShaRK install
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon && make -C math-neon install
          # vitaGL from source: soft-float ABI, GLSL shader cache (compile once, load compiled binaries after), pthread-safe
          # NO_CIRCULAR_POOL=1: route per-draw temp vertex allocs (gpu_alloc_mapped_temp) through the regular RAM-pool allocator
          #   instead of the fixed circular ring. The ring overflowed on Scaleform's 1.75MB FE vertex draw and returned NULL,
          #   which VitaGL's custom-shader draw path memcpy'd into unchecked (the frame-600 Data abort). Regular allocator has
          #   the 43MB RAM pool (freed by the newlib 226 rebalance) to draw from.
          # TEXTURES_SPEEDHACK/BUFFERS_SPEEDHACK: VitaGL otherwise re-allocates a FULL copy of a texture/buffer on every
          #   glTexSubImage2D/glBufferSubData to an object drawn in the last 4 frames (Scaleform glyph atlas + mesh buffers,
          #   dozens of writes per frame) -> ~140MB of in-flight copies drained both pools by frame ~650 and fps fell to 1.4.
          #   Write in place instead. LOG_ERRORS=1: enables VitaGL's NULL checks on failed allocations (no file output).
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL
          # Allocation tracing: every pool allocation reports (size, pool, caller) to vgl_alloc_trace() in the loader.
          sed -i 's|^void \*vgl_malloc(size_t size, vglMemType type) {|extern void vgl_alloc_trace(size_t size, int type, void *ra);\nvoid *vgl_malloc(size_t size, vglMemType type) { vgl_alloc_trace(size, type, __builtin_return_address(0));|; s|^void \*vgl_calloc(size_t num, size_t size, vglMemType type) {|void *vgl_calloc(size_t num, size_t size, vglMemType type) { vgl_alloc_trace(num * size, type, __builtin_return_address(0));|; s|^void \*vgl_memalign(size_t alignment, size_t size, vglMemType type) {|void *vgl_memalign(size_t alignment, size_t size, vglMemType type) { vgl_alloc_trace(size, type, __builtin_return_address(0));|' vitaGL/source/utils/mem_utils.c
          grep -c vgl_alloc_trace vitaGL/source/utils/mem_utils.c
          # glCopyTexImage2D readback scratch: VitaGL vglMalloc()s width*height*4 per call (3MB for the FE's 1024x768 blur copies,
          # several times a second in menus), tries newlib first (full) then the pools, and memcpy's into the NULL when all fail.
          # Use a persistent scratch buffer from the loader instead (allocated once, reused, never freed).
          sed -i 's|^\tvoid \*tmp = vglMalloc(width \* height \* 4);|\textern void *vgl_scratch_get(size_t); void *tmp = vgl_scratch_get(width * height * 4); if (!tmp) return;|; s|^\tvgl_free(tmp);|\t/* scratch kept */|' vitaGL/source/textures.c
          grep -c vgl_scratch_get vitaGL/source/textures.c
          # Crash fix: with HAVE_SHADER_CACHE, a shader that FAILS to compile (s->prog == NULL) is still serialized to the
          # cache -> memcpy(buf, NULL, s->size) on the translator thread (the 21382-byte NULL-source data abort). Skip the write.
          sed -i 's|^\tSceUID f = sceIoOpen(cache_fname, SCE_O_CREAT \| SCE_O_WRONLY \| SCE_O_TRUNC, 0777);|\tif (!s->prog) return;\n\tSceUID f = sceIoOpen(cache_fname, SCE_O_CREAT \| SCE_O_WRONLY \| SCE_O_TRUNC, 0777);|' vitaGL/source/custom_shaders.c
          grep -c 'if (!s->prog) return;' vitaGL/source/custom_shaders.c
          # Same bug at link time (pair/postponed mode compiles in glLinkProgram): a NULL shader program is handed to sceGxm.
          sed -i 's|^\tif (p->status == PROG_LINKED) {|\tif (!p->vshader->prog \|\| !p->fshader->prog) { p->status = PROG_INVALID; return; }\n\tif (p->status == PROG_LINKED) {|' vitaGL/source/custom_shaders.c
          grep -c 'p->status = PROG_INVALID; return;' vitaGL/source/custom_shaders.c
          # VitaGL's GLSL translator work buffers come from newlib malloc (vgl_realloc(NULL) -> malloc). Our newlib heap is
          # almost entirely owned by the game's fixed pools; when its slack ran out, malloc returned NULL and the translator
          # memcpy'd into NULL. Serve those buffers from VitaGL's own RAM pool (60MB+ free) first.
          sed -i '/^void \*vgl_realloc(void \*ptr, size_t size) {/,/^}/ s|^\t\treturn malloc(size);|\t\t{ void *r = vgl_malloc(size, VGL_MEM_RAM); return r ? r : malloc(size); }|' vitaGL/source/utils/mem_utils.c
          grep -c 'vgl_malloc(size, VGL_MEM_RAM); return r ? r : malloc(size);' vitaGL/source/utils/mem_utils.c
          # Stencil leak: when VitaGL discards a framebuffer's hidden depth/stencil surface it frees only depthData, never
          # stencilData (920KB per 1280x720 rebuild, ~120MB over a session before the attach cache). Free both.
          sed -i 's|mark_as_dirty(fb->depthbuffer_ptr->depthData);|{ mark_as_dirty(fb->depthbuffer_ptr->depthData); if (fb->depthbuffer_ptr->stencilData) { mark_as_dirty(fb->depthbuffer_ptr->stencilData); } }|' vitaGL/source/framebuffers.c vitaGL/source/textures.c
          grep -c 'mark_as_dirty(fb->depthbuffer_ptr->stencilData)' vitaGL/source/framebuffers.c vitaGL/source/textures.c
          # Shader cache hardening: a truncated/corrupt .gxp (e.g. written by an older build) was handed straight to sceGxm.
          # Validate the header and the GXP magic; on failure leave s->prog NULL so the shader is recompiled from source
          # (or the program is marked invalid by the link guard above) instead of crashing in SceGxm.
          sed -i 's|^\tvgl_fast_memcpy(&matrix_uniforms_num, buf, sizeof(uint32_t));|\tif (!in \|\| sz < 8) { s->prog = NULL; return; }\n\tvgl_fast_memcpy(\&matrix_uniforms_num, buf, sizeof(uint32_t));\n\tif (matrix_uniforms_num > 4096 \|\| sizeof(uint32_t) * (matrix_uniforms_num + 1) + 16 > sz) { s->prog = NULL; return; }|' vitaGL/source/custom_shaders.c
          sed -i 's|^\ts->size = sz - ((uintptr_t)buf - (uintptr_t)in);|\tif ((size_t)((uintptr_t)buf - (uintptr_t)in) + 16 > sz \|\| memcmp(buf, "GXP", 3)) { s->prog = NULL; return; }\n\ts->size = sz - ((uintptr_t)buf - (uintptr_t)in);|' vitaGL/source/custom_shaders.c
          grep -c 'memcmp(buf, "GXP", 3)' vitaGL/source/custom_shaders.c
          make -C vitaGL SOFTFP_ABI=1 HAVE_SHADER_CACHE=1 NO_CIRCULAR_POOL=1 TEXTURES_SPEEDHACK=1 BUFFERS_SPEEDHACK=1 LOG_ERRORS=1 HAVE_SHARK_LOG=1 install
      - name: Build
        run: |
          export PATH=$VITASDK/bin:$PATH
          mkdir -p build && cd build && cmake -DBUILD_ID=${GITHUB_SHA::7} .. && make
      - name: Publish symbol map (branch 'symbols', for crash-dump symbolization)
        run: |
          export PATH=$VITASDK/bin:$PATH
          SHA=${GITHUB_SHA::7}
          mkdir -p /tmp/sym && arm-vita-eabi-nm -n -C build/ssx_vita | gzip -9 > /tmp/sym/$SHA.nm.gz
          arm-vita-eabi-readelf -S build/ssx_vita | gzip -9 > /tmp/sym/$SHA.sections.gz
          git config user.name "ssx-ci" && git config user.email "ci@users.noreply.github.com"
          git fetch origin symbols && git checkout symbols || git checkout --orphan symbols
          git rm -rfq --cached . >/dev/null 2>&1 || true
          mkdir -p symbols && cp /tmp/sym/* symbols/ && git add -f symbols && (git commit -qm "symbols for $SHA" && git push origin symbols || echo "symbols for $SHA already published")
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SSX-vpk
          path: |
            build/SSX.vpk
            build/ssx_vita
