name: Build SSX.vpk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: /usr/local/vitasdk
    steps:
      - uses: actions/checkout@v4
      - name: Install soft-float VitaSDK
        run: |
          sudo apt-get update && sudo apt-get install -y cmake git make curl
          git clone --depth 1 https://github.com/vitasdk-softfp/vdpm
          cd vdpm && sudo -E ./bootstrap-vitasdk.sh && sudo -E ./install-all.sh
          sudo chown -R $USER $VITASDK
      - name: Install port libraries
        run: |
          export PATH=$VITASDK/bin:$PATH
          git clone --depth 1 https://github.com/Rinnegatamante/vitaShaRK && make -C vitaShaRK install
          git clone --depth 1 https://github.com/Rinnegatamante/math-neon && make -C math-neon install
          # vitaGL from source: soft-float ABI, GLSL shader cache (compile once, load compiled binaries after), pthread-safe
          # NO_CIRCULAR_POOL=1: route per-draw temp vertex allocs (gpu_alloc_mapped_temp) through the regular RAM-pool allocator
          #   instead of the fixed circular ring. The ring overflowed on Scaleform's 1.75MB FE vertex draw and returned NULL,
          #   which VitaGL's custom-shader draw path memcpy'd into unchecked (the frame-600 Data abort). Regular allocator has
          #   the 43MB RAM pool (freed by the newlib 226 rebalance) to draw from.
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL && make -C vitaGL SOFTFP_ABI=1 HAVE_SHADER_CACHE=1 NO_CIRCULAR_POOL=1 install
      - name: Build
        run: |
          export PATH=$VITASDK/bin:$PATH
          mkdir -p build && cd build && cmake -DBUILD_ID=${GITHUB_SHA::7} .. && make
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SSX-vpk
          path: |
            build/SSX.vpk
            build/ssx_vita
